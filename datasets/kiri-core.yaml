schemaVersion: "1.0.0"
name: "kiri-core"
datasetId: "kiri-core"
version: "v2026-01-01"
description: "Core KIRI repository search quality dataset (non-VSCode)."

defaultParams:
  k: 10
  timeoutMs: 30000

queries:
  - id: "bugfix-001"
    text: "request queue retry handling for transient failures"
    goal: "Locate retry logic used by the client request queue."
    metadata:
      category: "bugfix"
      intent: "Find retry/queue logic"
      tool: "context_bundle"
      tags: ["retry", "client", "queue"]
      expected:
        - path: "src/client/request-queue.ts"
          relevance: 3
        - path: "src/shared/utils/retry.ts"
          relevance: 2

  - id: "bugfix-002"
